<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vogue Paris — Cover Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@400;500&display=swap">
<style>
/* Every cover on one board; tap one for the full-resolution scan to copy. */
:root{--wall:#e4e5e8;--ink:#1b1c21;--muted:#6b6d76;--rose:#b42f57;--card:#f4f4f5;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--wall:#15161a;--ink:#ebe9e5;--muted:#9a9ba3;--rose:#e0628a;--card:#1e1f24}}
:root[data-theme="dark"]{color-scheme:dark;--wall:#15161a;--ink:#ebe9e5;--muted:#9a9ba3;--rose:#e0628a;--card:#1e1f24}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;padding-block:22px 16px;max-width:1600px;margin:0 auto}
h1{font:400 clamp(28px,5vw,48px)/1.1 var(--display);margin:0}
h1 i{color:var(--rose)}
header a{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
header a:hover{color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;max-width:1600px;margin:0 auto}
@media (min-width:900px){.board{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.board button{all:unset;cursor:pointer;display:block;aspect-ratio:240/300;background:var(--card);overflow:hidden;position:relative}
.board img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.board button:hover img,.board button:focus-visible img{opacity:.85}
.board button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:50;background:#0d0d10;display:flex;flex-direction:column}
#lb[hidden]{display:none!important}
#lb .bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;color:#ddd;font-size:14px}
#lb .bar .t{flex:1;font:italic 400 17px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb .bar .t small{font:400 12px var(--body);color:#888;margin-left:8px;font-style:normal}
#lb .btn{all:unset;cursor:pointer;padding:8px 12px;border:1px solid #444;border-radius:6px;color:#eee;font-size:13px;white-space:nowrap}
#lb .btn:hover{border-color:#888}
#lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);position:relative}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;background:#222}
#lb .nav{all:unset;cursor:pointer;position:absolute;top:0;bottom:0;width:18%;}
#lb .nav.prev{left:0}#lb .nav.next{right:0}
#lb .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);color:#aaa;font-size:12px;background:rgb(0 0 0/.6);padding:4px 10px;border-radius:99px;pointer-events:none;transition:opacity .3s;opacity:0}
@media (max-width:520px){#lb .btn.open{display:none}}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header>
  <h1>Vogue <i>Paris</i> · the covers</h1>
  <a href="/">← Back to the wall</a>
</header>
<main class="board" id="board"></main>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Cover">
  <div class="bar">
    <span class="t" id="lbT"></span>
    <button class="btn" id="lbCopy">Copy</button>
    <a class="btn open" id="lbOpen" target="_blank" rel="noopener">Open full size</a>
    <button class="btn" id="lbX" aria-label="Close">✕</button>
  </div>
  <div class="stage">
    <img id="lbImg" alt="">
    <button class="nav prev" id="lbPrev" aria-label="Previous cover"></button>
    <button class="nav next" id="lbNext" aria-label="Next cover"></button>
    <span class="hint" id="lbHint"></span>
  </div>
</div>

<script>
var rows = [], cur = -1;
var $ = function (id) { return document.getElementById(id); };
Promise.all([fetch('/data/issues.json').then(function (r) { return r.json(); }),
             fetch('/data/covers.json').then(function (r) { return r.json(); })]).then(function (res) {
  var covers = res[1];
  rows = res[0].filter(function (d) { return d.ready && covers[d.ark]; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; })
    .map(function (d) { var c = covers[d.ark]; return { ark: d.ark, label: d.label, url: c.url, w: c.w, h: c.h }; });
  var frag = document.createDocumentFragment();
  rows.forEach(function (d, i) {
    var b = document.createElement('button');
    b.setAttribute('aria-label', 'Open cover, ' + d.label);
    b.title = d.label;
    b.innerHTML = '<img loading="lazy" src="/covers/' + d.ark + '.webp" alt="">';
    b.onclick = function () { open(i); };
    frag.appendChild(b);
  });
  $('board').appendChild(frag);
  var m = location.hash.match(/^#(\w+)$/);
  if (m) { var k = rows.findIndex(function (d) { return d.ark === m[1]; }); if (k >= 0) open(k); }
});

function open(i) {
  cur = (i + rows.length) % rows.length;
  var d = rows[cur], img = $('lbImg');
  img.src = '/covers/' + d.ark + '.webp';          // instant placeholder
  var hi = new Image(); hi.crossOrigin = 'anonymous';
  hi.onload = function () { if (rows[cur] === d) { img.crossOrigin = 'anonymous'; img.src = d.url; } };
  hi.src = d.url;
  img.alt = 'Vogue Paris cover, ' + d.label;
  $('lbT').innerHTML = d.label + '<small>' + d.w + ' × ' + d.h + '</small>';
  $('lbOpen').href = d.url;
  $('lbCopy').textContent = 'Copy';
  $('lb').hidden = false; document.body.style.overflow = 'hidden';
  history.replaceState(null, '', '#' + d.ark);
  [cur - 1, cur + 1].forEach(function (j) { var r = rows[(j + rows.length) % rows.length]; new Image().src = r.url; });
}
function close() { $('lb').hidden = true; document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); }
function hint(t) { var h = $('lbHint'); h.textContent = t; h.style.opacity = 1; clearTimeout(hint.t); hint.t = setTimeout(function () { h.style.opacity = 0; }, 1800); }

// Clipboard only takes PNG in most browsers, so draw the JPEG to a canvas first.
$('lbCopy').onclick = function () {
  var d = rows[cur], btn = this;
  btn.textContent = 'Copying…';
  var blobP = new Promise(function (ok, fail) {
    var im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = function () {
      var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0); c.toBlob(function (b) { b ? ok(b) : fail(); }, 'image/png');
    };
    im.onerror = fail; im.src = d.url;
  });
  try {
    navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]).then(function () {
      btn.textContent = 'Copied ✓'; hint('Full-size cover copied — paste into Substack');
    }, function () { btn.textContent = 'Copy'; hint('Copy blocked here — use Open full size, then right-click → Copy image'); });
  } catch (e) { btn.textContent = 'Copy'; hint('Copy blocked here — use Open full size, then right-click → Copy image'); }
};
$('lbX').onclick = close;
$('lbPrev').onclick = function () { open(cur - 1); };
$('lbNext').onclick = function () { open(cur + 1); };
document.addEventListener('keydown', function (e) {
  if ($('lb').hidden) return;
  if (e.key === 'Escape') close();
  else if (e.key === 'ArrowLeft') open(cur - 1);
  else if (e.key === 'ArrowRight') open(cur + 1);
});
var sx = null;
$('lb').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', function (e) {
  if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) open(cur + (dx < 0 ? 1 : -1));
});
</script>
</body>
</html>
