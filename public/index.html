<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Every French Vogue cover on Gallica, 1920–1954. Tap one to read the issue.">
<title>Vogue Paris 1920–1954</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: a hanging wall. One row per year, covers hung like prints; tap one to read it. */
:root{
  --wall:#e4e5e8;      /* cool mat board */
  --card:#f4f4f5;
  --ink:#1b1c21;
  --muted:#6b6d76;
  --rule:#c9cad0;
  --rose:#b42f57;      /* Lepape rose */
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--wall:#15161a;--card:#1e1f24;--ink:#ebe9e5;--muted:#9a9ba3;--rule:#33343b;--rose:#e0628a;}}
:root[data-theme="dark"]{color-scheme:dark;--wall:#15161a;--card:#1e1f24;--ink:#ebe9e5;--muted:#9a9ba3;--rule:#33343b;--rose:#e0628a;}

*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wall)}
.wrap{max-width:1280px;margin:0 auto}
header.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;padding-block:28px 14px}
h1{font:400 clamp(40px,7vw,76px)/1.08 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 i{color:var(--rose)}



/* years */
section.year{display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:20px;padding-block:28px;border-bottom:1px solid var(--rule);scroll-margin-top:16px}
.yh{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;display:flex;flex-direction:column;gap:4px}
.yh h2{font:400 clamp(34px,4.5vw,52px)/1 var(--display);margin:0;font-variant-numeric:lining-nums}
.yh small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.yh .era{font:italic 400 14px/1.3 var(--display);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,150px),1fr));gap:22px 16px}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
.frame{position:relative;aspect-ratio:240/300;background:var(--card);box-shadow:0 1px 2px rgb(0 0 0/.12),0 6px 18px -8px rgb(0 0 0/.35);cursor:pointer;overflow:hidden;border:0;padding:0;display:block;width:100%}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.frame:hover img{transform:scale(1.03)}
.frame:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hide{display:none!important}

footer{padding-block:28px;color:var(--muted);font-size:12px;max-width:70ch}
footer a{color:inherit}
@media (max-width:640px){
  section.year{grid-template-columns:1fr;gap:12px}
  .yh{position:static;flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){.frame img{transition:none}}
.frame{text-decoration:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <h1>Vogue <i>Paris</i><br>1920–1954</h1>
  </header>
</div>


<div class="wrap">
  <main id="years"></main>
  <footer>Covers from Gallica, Bibliothèque nationale de France, title <a href="https://gallica.bnf.fr/ark:/12148/cb343833568/date">Vogue (Paris)</a>, ISSN 0750-3628. Gallica's run stops in 1954 and skips 1941–44, when Condé Nast suspended the French edition under the Occupation. Some years are bound annual volumes, so one cover stands for the year.</footer>
</div>


<script>
const ERAS={1920:"Lepape, Dryden, Plank",1925:"Art Deco",1929:"the crash",1934:"Horst, Hoyningen-Huene",1939:"Oct–Nov never printed",1945:"after the Liberation",1947:"the New Look"};
fetch('/data/issues.json').then(r=>r.json()).then(rows=>{
  const byYear={};rows.forEach(r=>(byYear[r.year]??=[]).push(r));
  const main=document.getElementById('years');
  for(const y of Object.keys(byYear).map(Number).sort((a,b)=>b-a)){  // newest first
    const n=byYear[y].length,s=document.createElement('section');s.className='year';s.id='y'+y;
    s.innerHTML=`<div class="yh"><h2>${y}</h2><small>${n} issue${n>1?'s':''}</small>${ERAS[y]?`<span class="era">${ERAS[y]}</span>`:''}</div><div class="grid"></div>`;
    const g=s.querySelector('.grid');
    for(const d of [...byYear[y]].reverse()){
      const f=document.createElement('figure');
      f.innerHTML=`<a class="frame" href="/issue/${d.ark}" aria-label="Read ${d.label}"><img loading="lazy" src="/covers/${d.ark}.webp" alt="Vogue Paris cover, ${d.label}"></a><figcaption><span>${d.label}</span></figcaption>`;
      g.appendChild(f);
    }
    main.appendChild(s);
  }
});
</script>
</body>
</html>
